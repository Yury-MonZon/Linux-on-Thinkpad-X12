[project]
name = "osk-tweaks-engine"
version = "1.0.0"
description = "Offline speech-to-text for the OSK Tweaks GNOME extension (OpenVINO, faster-whisper)"
requires-python = "==3.13.*"
# Exact pins: faster-whisper 1.2.1 calls av.open(..., metadata_errors=...), which PyAV 16+
# removed. openvino-genai pins openvino and openvino-tokenizers to its own version.
# uv.lock pins everything else, with hashes.
dependencies = [
    "openvino-genai==2026.4.1.0",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.3",
    "av==15.1.0",
]

[tool.uv]
package = false
# openvino depends on openvino-telemetry, which sends usage data to Google Analytics from a
# forked process; in this multi-threaded helper the fork deadlocks and the helper hangs at exit.
# openvino falls back to a built-in stub without it.
exclude-dependencies = ["openvino-telemetry"]
