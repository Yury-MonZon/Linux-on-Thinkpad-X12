PACKAGE_NAME="hid-lenovo-x12"
PACKAGE_VERSION="2.0"
# ThinkPad X12: Folio keyboard: restore FnLock, LEDs and Fn/Ctrl swap after a USB reset
# x12-dkms-build fetches the driver source matching each kernel (CachyOS tag or stable tree)
# and applies hid-lenovo-reset-resume.patch. Kernel 7.0 and newer only.
BUILT_MODULE_NAME[0]="hid-lenovo"
BUILT_MODULE_LOCATION[0]="src/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/hid"
MAKE[0]="bash ./x12-dkms-build ${kernelver} ${kernel_source_dir}"
BUILD_EXCLUSIVE_KERNEL_MIN="7.0"
AUTOINSTALL="yes"
