PACKAGE_NAME="ov8856-x12"
PACKAGE_VERSION="2.0"
# ThinkPad X12: rear camera sensor: power via INT3472 on ACPI, and system sleep PM ops
# x12-dkms-build fetches the driver source matching each kernel (CachyOS tag or stable tree)
# and applies ov8856-x12.patch. Kernel 7.0 and newer only.
BUILT_MODULE_NAME[0]="ov8856"
BUILT_MODULE_LOCATION[0]="src/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/media/i2c"
MAKE[0]="bash ./x12-dkms-build ${kernelver} ${kernel_source_dir}"
BUILD_EXCLUSIVE_KERNEL_MIN="7.0"
AUTOINSTALL="yes"
