# login-attempts-x12: where rejected Visage faces go, and the colour photo taken with them.
# Read by /usr/local/bin/login-attempts-x12 (shell syntax). Changes apply to the next attempt.

# Whose ~/Pictures gets the photos (they become that user's private files)
USER_NAME=monzon

# Folder for the photos; empty = ~/Pictures/LoginAttempts of USER_NAME
DEST=

# Take a colour photo with the front webcam after each rejected face: yes or no
RGB_PHOTO=yes

# Colour camera, size (an MJPEG size the camera offers) and seconds of auto-exposure first
RGB_CAMERA=/dev/v4l/by-path/pci-0000:00:14.0-usb-0:4:1.0-video-index0
RGB_SIZE=1920x1080
RGB_DELAY=1
