# ThinkPad X12: the PCH SMBus (00:1f.4) hangs on its first transaction (SPD probe at 0x50) and
# stays busy (HSTSTS 0x41), logging "SMBus is busy, can't use it!" x7 and stalling 0.4 s at boot.
# Nothing on the X12 uses this bus (RAM is soldered, battery/fan via EC, touchpad is USB).
blacklist i2c_i801
