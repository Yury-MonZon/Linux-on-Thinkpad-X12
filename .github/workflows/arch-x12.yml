# Build Arch packages with the X12 patches (arch-x12/build-arch-x12, one arch-x12/<pkgbase>.conf
# each) for their current version in Arch's [extra], sign them with the [x12] repo key and publish
# them in the pacman repo [x12] next to kernel-fixes-x12. Runs hourly; a package whose version is
# already published is skipped.
#
# Arch's packaging is cloned from gitlab.archlinux.org at the version's tag; the upstream source
# itself is pinned by the checksums in Arch's PKGBUILD. Only our own key (secret
# X12_REPO_SIGNING_KEY) signs the output.
name: arch-x12

on:
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'arch-x12/**'
      - 'patches/libcamera-ov8856-helper.patch'
      - 'patches/pipewire-x12.patch'
      - '.github/workflows/arch-x12.yml'

permissions:
  contents: write

# Shared with kernel-fixes-x12: both update the same repo database
concurrency:
  group: x12-repo
  cancel-in-progress: false

env:
  TAG: x12-repo

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      max-parallel: 1    # one job at a time: each one updates the repo database
      fail-fast: false
      matrix:
        pkgbase: [libcamera, pipewire]
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git github-cli python sudo

      - uses: actions/checkout@v4

      - name: Which version, already published?
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          PKGBASE: ${{ matrix.pkgbase }}
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ver=$(pacman -Si "extra/$PKGBASE" | sed -n 's/^Version *: //p')
          x12rel=$(sed -n 's/^x12rel=\([0-9]*\).*/\1/p' "arch-x12/$PKGBASE.conf")
          # GitHub release assets cannot have ':' (epochs), so package files use '_'
          pkg=$PKGBASE-${ver/:/_}.$x12rel-x86_64.pkg.tar.zst
          echo "Arch $PKGBASE $ver -> $pkg"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qxF "$pkg"; then
            echo "already published"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.v.outputs.skip != '1'
        env:
          PKGBASE: ${{ matrix.pkgbase }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"
          su builder -c "cd /home/builder && '$GITHUB_WORKSPACE/arch-x12/build-arch-x12' -o '$GITHUB_WORKSPACE/out' '$PKGBASE' '$VERSION'"

      - name: Sign and publish
        if: steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.X12_REPO_SIGNING_KEY }}
        run: |
          set -eu
          export GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          [ "$fpr" = "$(gpg --show-keys --with-colons kernel-fixes/x12-repo-key.asc | awk -F: '/^fpr/{print $10; exit}')" ] ||
            { echo "secret key does not match kernel-fixes/x12-repo-key.asc" >&2; exit 1; }
          repo=(-R "$GITHUB_REPOSITORY")
          cd out
          # pacman takes the file name from the database, so any name works
          for p in *:*.pkg.tar.zst; do
            [ -e "$p" ] && mv "$p" "${p//:/_}"
          done
          pkgs=(*.pkg.tar.zst)
          for p in "${pkgs[@]}"; do
            gpg --batch --detach-sign --no-armor -u "$fpr" "$p"
          done
          gh release download "$TAG" "${repo[@]}" -p 'x12.db.tar.gz' -p 'x12.files.tar.gz'
          repo-add --sign --key "$fpr" x12.db.tar.gz "${pkgs[@]}"
          # pacman downloads x12.db and x12.files (repo-add makes them and their .sig symlinks)
          for f in db files; do
            rm -f "x12.$f" "x12.$f.sig"
            cp "x12.$f.tar.gz" "x12.$f"
            cp "x12.$f.tar.gz.sig" "x12.$f.sig"
          done
          sigs=("${pkgs[@]/%/.sig}")
          gh release upload "$TAG" "${repo[@]}" --clobber "${pkgs[@]}" "${sigs[@]}" \
            x12.db x12.db.sig x12.files x12.files.sig \
            x12.db.tar.gz x12.db.tar.gz.sig x12.files.tar.gz x12.files.tar.gz.sig
          # keep the two newest versions of each package
          assets=$(gh release view "$TAG" "${repo[@]}" --json assets -q '.assets[].name')
          for p in "${pkgs[@]}"; do
            name=${p%-*-*-*.pkg.tar.zst}
            grep -E "^$name-[0-9][^-]*-[0-9.]+-x86_64\.pkg\.tar\.zst$" <<<"$assets" | sort -V | head -n -2 |
              while read -r old; do
                gh release delete-asset "$TAG" "$old" "${repo[@]}" -y
                gh release delete-asset "$TAG" "$old.sig" "${repo[@]}" -y || true
              done
          done
